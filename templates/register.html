<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your account and get started today.">
    <title>Create your account | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell">
        <section class="intro-panel" aria-labelledby="welcome-title">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>Visco</span>
            </div>

            <div class="intro-copy">
                <p class="eyebrow">A fresh start</p>
                <h1 id="welcome-title">Make space for what matters.</h1>
                <p>Join a community built for better ideas, meaningful connections, and your next chapter.</p>
            </div>

            <div class="intro-note">
                <span class="note-dot" aria-hidden="true"></span>
                <span>Simple, secure, and made for you.</span>
            </div>
        </section>

        <section class="form-panel" aria-labelledby="form-title">
            <div class="form-heading">
                <h2 id="form-title">Create your account</h2>
                <p>Fill in your details to get started.</p>
            </div>

            <form class="registration-form" action="{{ url_for('register') }}" method="POST">
                <div class="field-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
                </div>

                <div class="field-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel" required>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
                </div>

                <label class="form-footer" for="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>I agree to the terms of service and privacy policy.</span>
                </label>

                <button class="submit-button" type="submit">Create account <span aria-hidden="true">→</span></button>
            </form>

            <p class="sign-in">Already have an account? <a href="#">Sign in</a></p>
        </section>
    </main>
</body>
</html>
