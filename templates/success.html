<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your Visco account has been created successfully.">
    <title>Welcome to Visco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="success-page">
    <main class="success-card" aria-labelledby="success-title">
        <span class="success-shape success-shape-one" aria-hidden="true"></span>
        <span class="success-shape success-shape-two" aria-hidden="true"></span>
        <span class="success-shape success-shape-three" aria-hidden="true"></span>

        <div class="success-icon" aria-hidden="true">
            <svg viewBox="0 0 52 52" role="presentation">
                <path d="M14 27.5 22 35l16-18" />
            </svg>
        </div>

        <p class="success-eyebrow">Welcome to BRO</p>
        <h1 id="success-title">HAVE A DAY<span class="accent-dot">.</span></h1>
        <p class="success-message">Thanks for joining us, <strong>{{ name }}</strong>. Your account has been created successfully.</p>
        <a class="success-button" href="{{ url_for('home') }}">Back to home <span aria-hidden="true">→</span></a>
    </main>
</body>
</html>
